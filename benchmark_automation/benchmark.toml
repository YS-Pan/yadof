schema_version = 1

[runner]
runs_dir = "../temp"
strategy_template_dir = "strategy_templates"
history_snapshot_dir = "history_snapshots"
minimum_free_disk_mib = 2048
command_timeout_sec = 7200
audit_sample_percent = 10
audit_random_seed = 20260823

[runner.measured_config_overrides]
HISTORY_SEGMENT_MAX_CANDIDATES = 100
HISTORY_UNPUBLISHED_MAX_CANDIDATES = 128
FAST_RESOURCE_AUTODETECT_ENABLED = false

[arms.nsga3]
strategy_template = "nsga3.py"
display_name = "NSGA-III"
surrogate = false

[arms.gpsaf-conditional-inr]
strategy_template = "gpsaf_conditional_inr.py"
display_name = "GPSAF + conditional-INR"
surrogate = true

[arms.gpsaf-conditional-inr.config_overrides]
OPTIMIZE_SURROGATE_ALPHA = 3
OPTIMIZE_SURROGATE_BETA = 3
OPTIMIZE_SURROGATE_EXPLORATION_FRACTION = 0.15

[cases.saw]
baseline = "baselines/ngspice/saw-ladder"
include_paths = ["config.py", "submit", "job_template", "postprocess.py"]
mode = "fast"
history_policy = "empty"
expected_objectives = 5
observed_eval_sec = 0.70
estimated_record_mib = 0.08
max_workers = 32
representative_expensive_generation_sec = 3600

[cases.saw.resource]
kind = "environment_executable"
variable = "YADOF_NGSPICE_EXE"

[cases.saw.rawdata_shapes]
s21_db = [1201]
s11_db = [1201]

[cases.chrono]
baseline = "baselines/chrono/trebuchet"
include_paths = ["config.py", "submit", "job_template", "postprocess.py", "visualization"]
mode = "fast"
history_policy = "empty"
expected_objectives = 4
observed_eval_sec = 3.90
estimated_record_mib = 0.12
max_workers = 32
representative_expensive_generation_sec = 7200

[cases.chrono.resource]
kind = "environment_executable"
variable = "YADOF_PYCHRONO_PYTHON"

[cases.chrono.rawdata_shapes]
trebuchet_total_time = []
trebuchet_loaded_max_height = []
trebuchet_minimum_ball_center_z = []
trebuchet_trigger_time = []
trebuchet_released_flag = []
trebuchet_release_sling_arm_rotation = []
trebuchet_minimum_arm_ground_clearance = []
trebuchet_minimum_hanger_ground_clearance = []
trebuchet_minimum_counterweight_ground_clearance = []
trebuchet_ball_x = [513]
trebuchet_ball_z = [513]
trebuchet_ball_vx = [513]
trebuchet_ball_vz = [513]
trebuchet_arm_combined_normal_stress = [513]
trebuchet_hanger_combined_normal_stress = [513]
trebuchet_peak_strength_utilization = [513]

[cases.test-com]
baseline = "baselines/test-com/synthetic-antenna"
include_paths = ["config.py", "submit", "job_template", "postprocess.py"]
mode = "fast"
history_policy = "empty"
expected_objectives = 4
observed_eval_sec = 0.60
estimated_record_mib = 0.50
max_workers = 32

[cases.test-com.resource]
kind = "cuda"

[cases.test-com.rawdata_shapes]
s11_pinState1 = [5]
s11_pinState2 = [5]
s11_pinState3 = [5]
gain_lhcp_pinState1 = [1, 73, 73]
gain_lhcp_pinState2 = [1, 73, 73]
gain_lhcp_pinState3 = [1, 73, 73]
axial_ratio_pinState1 = [5, 73, 73]
axial_ratio_pinState2 = [5, 73, 73]
axial_ratio_pinState3 = [5, 73, 73]

[suites.structural-canary]
purpose = "structural"
cases = ["test-com"]
arms = ["nsga3", "gpsaf-conditional-inr"]
seeds = [20260816]
smoke = true
fail_fast = true

[suites.adapter-smoke]
purpose = "structural"
cases = ["saw", "chrono"]
arms = []
seeds = [20260823]
smoke = true
smoke_only = true
fail_fast = true

[suites.structural-full]
purpose = "structural"
cases = ["saw", "chrono", "test-com"]
arms = ["nsga3", "gpsaf-conditional-inr"]
seeds = [20260823]
smoke = true
fail_fast = true

[suites.performance-pilot]
purpose = "performance"
cases = ["saw", "chrono", "test-com"]
arms = ["nsga3", "gpsaf-conditional-inr"]
seeds = [104729]
smoke = false
fail_fast = false

[suites.performance]
purpose = "performance"
