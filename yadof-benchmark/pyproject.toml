[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yadof-benchmark"
dynamic = ["version"]
description = "Code-first benchmark workspaces for yadof optimization strategies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["yadof>=0.4.2"]

[project.optional-dependencies]
dev = ["build>=1.2", "hatchling>=1.27", "pytest>=8"]

[project.scripts]
yadof-benchmark = "yadof_benchmark.cli:main"

[tool.hatch.version]
path = "src/yadof_benchmark/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yadof_benchmark"]

[tool.hatch.build.targets.wheel.force-include]
"baselines" = "yadof_benchmark/_resources/baselines"
"user_doc" = "yadof_benchmark/_resources/user_doc"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/yadof_benchmark",
    "/baselines",
    "/user_doc",
    "/dev_doc",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
